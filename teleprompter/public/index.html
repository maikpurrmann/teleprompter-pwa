<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <title>Teleprompter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; background: #000; color: #fff; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0; }

    /* Mode Selection (Start Screen) */
    #mode-select {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; padding: 2rem; gap: 1.5rem;
    }
    #mode-select h1 { font-size: 2rem; font-weight: 300; letter-spacing: 0.1em; }
    #mode-select .group { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 0.75rem; }
    #mode-select button {
      padding: 1.5rem; font-size: 1.2rem; border: 1px solid #444; border-radius: 8px;
      background: #111; color: #fff; cursor: pointer; transition: background 0.2s;
    }
    #mode-select button:active { background: #333; }
    #mode-select .mode-desc { font-size: 0.8rem; color: #888; margin-top: 0.3rem; }

    /* Loader Screen (file selection) */
    #loader {
      display: none; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; padding: 2rem; gap: 1.5rem;
    }
    #loader h2 { font-size: 1.5rem; font-weight: 300; }
    #loader .group { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 0.75rem; }
    #loader button, #loader .url-row button {
      padding: 1rem; font-size: 1.1rem; border: 1px solid #444; border-radius: 8px;
      background: #111; color: #fff; cursor: pointer; transition: background 0.2s;
    }
    #loader button:active { background: #333; }
    #loader input {
      padding: 1rem; font-size: 1rem; border: 1px solid #444; border-radius: 8px;
      background: #111; color: #fff; width: 100%;
    }
    #loader .url-row { display: flex; gap: 0.5rem; }
    #loader .url-row input { flex: 1; }
    #loader .url-row button { padding: 1rem 1.5rem; white-space: nowrap; }
    #loader .recent { font-size: 0.85rem; color: #888; text-align: center; cursor: pointer; }
    #loader .recent:hover { color: #fff; }

    /* Prompter Screen */
    #prompter { display: none; height: 100%; position: relative; }
    #prompter-text {
      height: 100%; overflow-y: auto; padding: 50vh 15vw;
      font-size: 2.5rem; line-height: 1.6; scroll-behavior: auto;
      -webkit-overflow-scrolling: touch;
    }
    #prompter-text.mirrored { transform: scaleY(-1); }
    #prompter-text h1 { font-size: 2.5em; margin: 0.5em 0 0.3em; font-weight: 600; }
    #prompter-text h2 { font-size: 2em; margin: 0.5em 0 0.3em; font-weight: 500; }
    #prompter-text h3 { font-size: 1.5em; margin: 0.4em 0 0.2em; font-weight: 500; }
    #prompter-text p { margin: 0.6em 0; }
    #prompter-text ul, #prompter-text ol { margin: 0.5em 0 0.5em 1.5em; }
    #prompter-text li { margin: 0.3em 0; }
    #prompter-text strong { color: #ffd700; }
    #prompter-text em { color: #aef; }

    /* Toolbar */
    #toolbar {
      position: absolute; bottom: 0; left: 0; right: 0;
      display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1rem;
      padding-bottom: calc(0.75rem + env(safe-area-inset-bottom));
      background: rgba(0,0,0,0.85); backdrop-filter: blur(4px);
      transition: opacity 0.4s; z-index: 10;
    }
    #toolbar.hidden { opacity: 0; pointer-events: none; }
    #toolbar button {
      width: 44px; height: 44px; border: none; border-radius: 8px;
      background: #222; color: #fff; font-size: 1.2rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #toolbar #btn-play {
      width: 64px; height: 64px; font-size: 1.8rem; border-radius: 50%; background: #333;
    }
    #toolbar button:active { background: #444; }
    #toolbar button.active { background: #336; }
    #toolbar input[type="range"] { flex: 1; max-width: 160px; accent-color: #fff; }
    #toolbar .speed-wrap { display: flex; align-items: center; gap: 6px; flex: 1; max-width: 200px; }
    #toolbar .speed-wrap input[type="range"] { flex: 1; max-width: none; }
    #toolbar .speed-val { font-size: 0.75rem; color: #aaa; min-width: 1.8em; text-align: center; }
    #toolbar .spacer { flex: 1; }

    /* Progress indicator */
    #progress {
      position: absolute; top: 0; left: 0; height: 3px;
      background: rgba(255,255,255,0.4); transition: width 0.1s;
    }

    /* Remote Control Screen */
    #remote {
      display: none; height: 100%; flex-direction: column;
      align-items: center; justify-content: center; gap: 2rem; padding: 2rem;
    }
    #remote h2 { font-size: 1.3rem; font-weight: 300; letter-spacing: 0.05em; }
    #remote .rc-status { font-size: 0.85rem; color: #888; }
    #remote .rc-status.connected { color: #4c4; }
    #remote .rc-progress-wrap {
      width: 100%; max-width: 400px; height: 6px; background: #222; border-radius: 3px; overflow: hidden;
    }
    #remote .rc-progress-bar { height: 100%; background: rgba(255,255,255,0.5); width: 0; transition: width 0.3s; }
    #remote .rc-controls {
      display: flex; flex-direction: column; align-items: center; gap: 1.5rem; width: 100%; max-width: 400px;
    }
    #remote .rc-row { display: flex; align-items: center; gap: 1rem; width: 100%; justify-content: center; }
    #remote button {
      border: none; border-radius: 8px; background: #222; color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: background 0.2s;
    }
    #remote button:active { background: #444; }
    #remote button.active { background: #336; }
    #remote #rc-play {
      width: 80px; height: 80px; font-size: 2.2rem; border-radius: 50%; background: #333;
    }
    #remote .rc-btn { width: 56px; height: 56px; font-size: 1.4rem; }
    #remote .rc-speed-wrap {
      display: flex; align-items: center; gap: 10px; width: 100%;
    }
    #remote .rc-speed-wrap input[type="range"] { flex: 1; accent-color: #fff; }
    #remote .rc-speed-wrap .speed-label { font-size: 0.85rem; color: #aaa; min-width: 3em; text-align: center; }
    #remote .rc-back {
      position: absolute; top: 1rem; left: 1rem; width: 44px; height: 44px;
      font-size: 1.2rem; background: #222; border-radius: 8px;
    }
    #remote .rc-info { font-size: 0.75rem; color: #555; text-align: center; max-width: 300px; line-height: 1.4; }
  </style>
</head>
<body>
  <!-- Start Screen: Mode Selection -->
  <div id="mode-select">
    <h1>TELEPROMPTER</h1>
    <div class="group">
      <button id="btn-mode-prompter">
        Prompter
        <div class="mode-desc">Text laden und anzeigen</div>
      </button>
      <button id="btn-mode-remote">
        Remote Control
        <div class="mode-desc">Prompter von einem anderen Gerät steuern</div>
      </button>
    </div>
    <div id="pwa-hint" style="display:none; font-size:0.8rem; color:#666; text-align:center; line-height:1.5; max-width:300px;">
      Tipp: In Safari unten auf Teilen ↗ tippen, dann „Zum Home-Bildschirm" — die App läuft dann ohne Adressleiste im Vollbild.
    </div>
  </div>

  <!-- Loader Screen (file selection, only in prompter mode) -->
  <div id="loader">
    <h2>Text laden</h2>
    <div class="group">
      <button id="btn-file">Datei öffnen</button>
      <input type="file" id="file-input" accept=".md,.txt,.markdown" hidden>
      <div class="url-row">
        <input type="url" id="url-input" placeholder="URL zur .md-Datei">
        <button id="btn-url">Laden</button>
      </div>
    </div>
    <div id="recent" class="recent" style="display:none"></div>
    <button id="btn-loader-back" style="margin-top:1rem; padding:0.75rem 2rem; font-size:1rem; border:1px solid #444; border-radius:8px; background:#111; color:#fff; cursor:pointer;">Zurück</button>
  </div>

  <!-- Prompter Screen -->
  <div id="prompter">
    <div id="toolbar">
      <button id="btn-back" title="Zurück">◀</button>
      <button id="btn-play" title="Play/Pause"><svg viewBox="0 0 24 24" fill="currentColor" width="1em" height="1em"><polygon points="6,3 20,12 6,21"/></svg></button>
      <div class="speed-wrap">
        <input type="range" id="speed-slider" min="0" max="6" value="0" step="1" title="Geschwindigkeit">
        <span class="speed-val" id="speed-val">60</span>
      </div>
      <span class="spacer"></span>
      <button id="btn-mirror" title="Spiegeln">⟷</button>
      <button id="btn-smaller" title="Kleiner">A−</button>
      <button id="btn-bigger" title="Größer">A+</button>
      <button id="btn-top" title="Zum Anfang">↑</button>
      <button id="btn-fs" title="Vollbild" style="display:none">⛶</button>
    </div>
    <div id="prompter-text"></div>
    <div id="progress"></div>
  </div>

  <!-- Remote Control Screen -->
  <div id="remote">
    <button class="rc-back" id="rc-back" title="Zurück">◀</button>
    <h2>REMOTE CONTROL</h2>
    <div class="rc-status" id="rc-status">Verbinde...</div>
    <div class="rc-progress-wrap"><div class="rc-progress-bar" id="rc-progress"></div></div>
    <div class="rc-controls">
      <div class="rc-row">
        <button class="rc-btn" id="rc-up" title="Hoch scrollen">↑</button>
        <button id="rc-play" title="Play/Pause"><svg viewBox="0 0 24 24" fill="currentColor" width="1em" height="1em"><polygon points="6,3 20,12 6,21"/></svg></button>
        <button class="rc-btn" id="rc-down" title="Runter scrollen">↓</button>
      </div>
      <div class="rc-speed-wrap">
        <span class="speed-label">Tempo</span>
        <input type="range" id="rc-speed" min="0" max="6" value="0" step="1">
        <span class="speed-label" id="rc-speed-val">30</span>
      </div>
      <div class="rc-row">
        <button class="rc-btn" id="rc-top" title="Zum Anfang">↑</button>
        <button class="rc-btn" id="rc-smaller" title="Kleiner">A−</button>
        <button class="rc-btn" id="rc-bigger" title="Größer">A+</button>
        <button class="rc-btn" id="rc-mirror" title="Spiegeln">⟷</button>
      </div>
    </div>
    <div class="rc-info">Steuerung per Buttons oder Tastatur:<br>Space = Play/Pause, ↑↓ = Scrollen, ←→ = Tempo</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const loader = $('loader');
    const modeSelect = $('mode-select');
    const prompter = $('prompter');
    const remoteEl = $('remote');
    const textEl = $('prompter-text');
    const toolbar = $('toolbar');
    const progress = $('progress');
    const speedSlider = $('speed-slider');

    let scrolling = false;
    let scrollSpeed = 60;
    let scrollAccum = 0;
    let animFrame = null;
    let lastTime = null;
    let hideTimer = null;
    let fontSize = 2.5;
    let mode = null; // 'prompter' or 'remote'
    let ws = null;
    let wakeLock = null;

    async function requestWakeLock() {
      if (!('wakeLock' in navigator)) return;
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } catch (e) {}
    }

    async function releaseWakeLock() {
      if (wakeLock) { await wakeLock.release(); wakeLock = null; }
    }

    // --- WebSocket ---
    let wsReconnectTimer = null;
    let broadcastInterval = null;
    const IC_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" width="1em" height="1em"><polygon points="6,3 20,12 6,21"/></svg>';
    const IC_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor" width="1em" height="1em"><rect x="4" y="3" width="5" height="18"/><rect x="15" y="3" width="5" height="18"/></svg>';

    function connectWS() {
      if (ws) { ws.onclose = null; ws.close(); }
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const url = `${proto}//${location.host}`;
      if (mode === 'remote') {
        $('rc-status').textContent = 'Verbinde...';
        $('rc-status').classList.remove('connected');
      }
      ws = new WebSocket(url);
      ws.onopen = () => {
        if (mode === 'remote') {
          $('rc-status').textContent = 'Verbunden';
          $('rc-status').classList.add('connected');
        }
      };
      ws.onerror = () => {
        if (mode === 'remote') {
          $('rc-status').textContent = 'Fehler — ' + url;
          $('rc-status').classList.remove('connected');
        }
      };
      ws.onclose = () => {
        if (mode === 'remote') {
          $('rc-status').textContent = 'Getrennt — reconnect in 2s...';
          $('rc-status').classList.remove('connected');
        }
        clearTimeout(wsReconnectTimer);
        wsReconnectTimer = setTimeout(connectWS, 2000);
      };
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (mode === 'prompter') handlePrompterMessage(msg);
        if (mode === 'remote') handleRemoteMessage(msg);
      };
    }

    function send(msg) {
      if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg));
    }

    // --- Messages received by Prompter ---
    function handlePrompterMessage(msg) {
      switch (msg.cmd) {
        case 'play': startScroll(); break;
        case 'pause': stopScroll(); break;
        case 'toggle': if (scrolling) stopScroll(); else startScroll(); break;
        case 'speed':
          speedSlider.value = msg.val;
          scrollSpeed = speedSteps[msg.val];
          speedVal.textContent = scrollSpeed;
          break;
        case 'scroll-up': textEl.scrollTop -= 100; updateProgress(); break;
        case 'scroll-down': textEl.scrollTop += 100; updateProgress(); break;
        case 'top': textEl.scrollTop = 0; updateProgress(); break;
        case 'bigger':
          fontSize = Math.min(6, fontSize + 0.25);
          textEl.style.fontSize = fontSize + 'rem';
          break;
        case 'smaller':
          fontSize = Math.max(1, fontSize - 0.25);
          textEl.style.fontSize = fontSize + 'rem';
          break;
        case 'mirror':
          textEl.classList.toggle('mirrored');
          $('btn-mirror').classList.toggle('active');
          break;
      }
      broadcastState();
    }

    // --- Messages received by Remote ---
    function handleRemoteMessage(msg) {
      if (msg.type === 'state') {
        $('rc-progress').style.width = msg.progress + '%';
        if (msg.scrolling) {
          $('rc-play').innerHTML = IC_PAUSE;
          $('rc-play').classList.add('active');
        } else {
          $('rc-play').innerHTML = IC_PLAY;
          $('rc-play').classList.remove('active');
        }
        $('rc-speed').value = msg.speedIdx;
        $('rc-speed-val').textContent = speedSteps[msg.speedIdx];
      }
    }

    function broadcastState() {
      if (mode !== 'prompter') return;
      const max = textEl.scrollHeight - textEl.clientHeight;
      const pct = max > 0 ? (textEl.scrollTop / max) * 100 : 0;
      send({
        type: 'state',
        scrolling: scrolling,
        progress: Math.round(pct * 10) / 10,
        speedIdx: parseInt(speedSlider.value),
      });
    }

    // --- Mode Selection (Start Screen) ---
    $('btn-mode-prompter').addEventListener('click', () => {
      modeSelect.style.display = 'none';
      loader.style.display = 'flex';
    });

    $('btn-mode-remote').addEventListener('click', () => {
      modeSelect.style.display = 'none';
      startRemote();
    });

    // --- Loader (File Selection) ---
    $('btn-file').addEventListener('click', () => $('file-input').click());
    $('file-input').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      file.text().then(text => {
        saveRecent(file.name);
        startPrompter(text);
      });
    });

    $('btn-url').addEventListener('click', loadFromUrl);
    $('url-input').addEventListener('keydown', e => { if (e.key === 'Enter') loadFromUrl(); });

    function loadFromUrl() {
      const url = $('url-input').value.trim();
      if (!url) return;
      fetch(url)
        .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(text => { saveRecent(url); startPrompter(text); })
        .catch(e => alert('Fehler beim Laden: ' + e.message));
    }

    $('btn-loader-back').addEventListener('click', () => {
      loader.style.display = 'none';
      modeSelect.style.display = 'flex';
    });

    function saveRecent(name) {
      localStorage.setItem('tp-recent', name);
    }

    // Show recent
    const recent = localStorage.getItem('tp-recent');
    if (recent) {
      $('recent').textContent = 'Zuletzt: ' + recent;
      $('recent').style.display = 'block';
      $('recent').addEventListener('click', () => {
        if (recent.startsWith('http')) {
          $('url-input').value = recent;
          loadFromUrl();
        }
      });
    }

    // --- Prompter ---
    function startPrompter(markdown) {
      mode = 'prompter';
      const html = marked.parse(markdown, { breaks: true });
      textEl.innerHTML = html;
      loader.style.display = 'none';
      prompter.style.display = 'block';
      textEl.scrollTop = 0;
      showToolbar();
      connectWS();
      if (!broadcastInterval) broadcastInterval = setInterval(broadcastState, 500);
    }

    // Toolbar auto-hide
    function showToolbar() {
      toolbar.classList.remove('hidden');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => toolbar.classList.add('hidden'), 3000);
    }
    prompter.addEventListener('touchstart', showToolbar);
    prompter.addEventListener('click', showToolbar);

    // Back
    $('btn-back').addEventListener('click', () => {
      stopScroll();
      releaseWakeLock();
      mode = null;
      prompter.style.display = 'none';
      modeSelect.style.display = 'flex';
      clearInterval(broadcastInterval); broadcastInterval = null;
      clearTimeout(wsReconnectTimer);
      if (ws) { ws.onclose = null; ws.close(); ws = null; }
    });

    // Play/Pause
    $('btn-play').addEventListener('click', () => {
      if (scrolling) stopScroll(); else startScroll();
      broadcastState();
    });

    function startScroll() {
      scrolling = true;
      $('btn-play').innerHTML = IC_PAUSE;
      lastTime = performance.now();
      animFrame = requestAnimationFrame(scrollStep);
      requestWakeLock();
    }

    function stopScroll() {
      scrolling = false;
      $('btn-play').innerHTML = IC_PLAY;
      if (animFrame) cancelAnimationFrame(animFrame);
      animFrame = null;
      releaseWakeLock();
    }

    function scrollStep(now) {
      if (!scrolling) return;
      const dt = (now - lastTime) / 1000;
      lastTime = now;
      scrollAccum += scrollSpeed * dt;
      if (scrollAccum >= 1) {
        const px = Math.floor(scrollAccum);
        textEl.scrollTop += px;
        scrollAccum -= px;
      }
      updateProgress();
      animFrame = requestAnimationFrame(scrollStep);
    }

    // Pause on manual touch scroll
    let touchActive = false;
    textEl.addEventListener('touchstart', () => { touchActive = true; });
    textEl.addEventListener('touchend', () => {
      touchActive = false;
      if (scrolling) { lastTime = performance.now(); }
    });

    // Speed steps
    const speedSteps = [30, 45, 60, 80, 110, 150, 200];
    const speedVal = $('speed-val');
    scrollSpeed = speedSteps[0];
    speedSlider.addEventListener('input', () => {
      const idx = parseInt(speedSlider.value);
      scrollSpeed = speedSteps[idx];
      speedVal.textContent = scrollSpeed;
      broadcastState();
    });

    // Mirror
    $('btn-mirror').addEventListener('click', () => {
      textEl.classList.toggle('mirrored');
      $('btn-mirror').classList.toggle('active');
    });

    // Font size
    $('btn-bigger').addEventListener('click', () => {
      fontSize = Math.min(6, fontSize + 0.25);
      textEl.style.fontSize = fontSize + 'rem';
    });
    $('btn-smaller').addEventListener('click', () => {
      fontSize = Math.max(1, fontSize - 0.25);
      textEl.style.fontSize = fontSize + 'rem';
    });

    // Jump to top
    $('btn-top').addEventListener('click', () => {
      textEl.scrollTop = 0;
      updateProgress();
      broadcastState();
    });

    // Fullscreen toggle (Android/Desktop only)
    const btnFs = $('btn-fs');
    if (document.fullscreenEnabled) {
      btnFs.style.display = '';
      btnFs.addEventListener('click', () => {
        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else {
          document.documentElement.requestFullscreen();
        }
      });
      document.addEventListener('fullscreenchange', () => {
        btnFs.textContent = document.fullscreenElement ? '✕' : '⛶';
      });
    }

    // Progress bar
    textEl.addEventListener('scroll', updateProgress);
    function updateProgress() {
      const max = textEl.scrollHeight - textEl.clientHeight;
      const pct = max > 0 ? (textEl.scrollTop / max) * 100 : 0;
      progress.style.width = pct + '%';
    }

    // --- Remote Control ---
    function startRemote() {
      mode = 'remote';
      loader.style.display = 'none';
      modeSelect.style.display = 'none';
      remoteEl.style.display = 'flex';
      connectWS();
    }

    $('rc-back').addEventListener('click', () => {
      mode = null;
      remoteEl.style.display = 'none';
      modeSelect.style.display = 'flex';
      clearTimeout(wsReconnectTimer);
      if (ws) { ws.onclose = null; ws.close(); ws = null; }
    });

    $('rc-play').addEventListener('click', () => send({ cmd: 'toggle' }));
    $('rc-up').addEventListener('click', () => send({ cmd: 'scroll-up' }));
    $('rc-down').addEventListener('click', () => send({ cmd: 'scroll-down' }));
    $('rc-top').addEventListener('click', () => send({ cmd: 'top' }));
    $('rc-bigger').addEventListener('click', () => send({ cmd: 'bigger' }));
    $('rc-smaller').addEventListener('click', () => send({ cmd: 'smaller' }));
    $('rc-mirror').addEventListener('click', () => send({ cmd: 'mirror' }));

    $('rc-speed').addEventListener('input', () => {
      const idx = parseInt($('rc-speed').value);
      $('rc-speed-val').textContent = speedSteps[idx];
      send({ cmd: 'speed', val: idx });
    });

    // --- Keyboard Control (works in both modes) ---
    document.addEventListener('keydown', e => {
      if (mode === 'prompter') {
        switch (e.key) {
          case ' ': case 'Enter':
            e.preventDefault();
            if (scrolling) stopScroll(); else startScroll();
            broadcastState();
            break;
          case 'ArrowUp': case 'PageUp':
            e.preventDefault();
            textEl.scrollTop -= 100; updateProgress(); broadcastState();
            break;
          case 'ArrowDown': case 'PageDown':
            e.preventDefault();
            textEl.scrollTop += 100; updateProgress(); broadcastState();
            break;
          case 'ArrowRight':
            e.preventDefault();
            { const idx = Math.min(speedSteps.length - 1, parseInt(speedSlider.value) + 1);
              speedSlider.value = idx; scrollSpeed = speedSteps[idx]; speedVal.textContent = scrollSpeed; broadcastState(); }
            break;
          case 'ArrowLeft':
            e.preventDefault();
            { const idx = Math.max(0, parseInt(speedSlider.value) - 1);
              speedSlider.value = idx; scrollSpeed = speedSteps[idx]; speedVal.textContent = scrollSpeed; broadcastState(); }
            break;
        }
      } else if (mode === 'remote') {
        switch (e.key) {
          case ' ': case 'Enter':
            e.preventDefault(); send({ cmd: 'toggle' }); break;
          case 'ArrowUp': case 'PageUp':
            e.preventDefault(); send({ cmd: 'scroll-up' }); break;
          case 'ArrowDown': case 'PageDown':
            e.preventDefault(); send({ cmd: 'scroll-down' }); break;
          case 'ArrowRight':
            e.preventDefault();
            { const idx = Math.min(6, parseInt($('rc-speed').value) + 1);
              $('rc-speed').value = idx; $('rc-speed-val').textContent = speedSteps[idx];
              send({ cmd: 'speed', val: idx }); }
            break;
          case 'ArrowLeft':
            e.preventDefault();
            { const idx = Math.max(0, parseInt($('rc-speed').value) - 1);
              $('rc-speed').value = idx; $('rc-speed-val').textContent = speedSteps[idx];
              send({ cmd: 'speed', val: idx }); }
            break;
        }
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        if (mode && (!ws || ws.readyState > 1)) connectWS();
        if (scrolling) requestWakeLock();
      }
    });

    if (!window.navigator.standalone && /iPhone|iPad/.test(navigator.userAgent)) {
      const hint = $('pwa-hint');
      if (hint) hint.style.display = 'block';
    }

    // Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
